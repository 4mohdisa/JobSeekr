[project]
name = "jobseekr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "imap-tools>=1.15.0",
    "jinja2>=3.1.6",
    "litellm>=1.98.0",
    "lxml>=6.1.2",
    "pdfplumber>=0.11.10",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-jobspy==1.1.82",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8",
    "rapidfuzz>=3.14.5",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.4",
]
